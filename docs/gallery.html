  <div class="lightbox" id="galleryLightbox" role="dialog" aria-modal="true" aria-hidden="true" aria-label="Gallery image viewer">
    <button class="lightbox-close" type="button" aria-label="Close gallery viewer">Close</button>
    <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous image">&lt;</button>
    <figure class="lightbox-figure">
      <img class="lightbox-image" src="" alt="">
      <figcaption class="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-nav lightbox-next" type="button" aria-label="Next image">&gt;</button>
  </div>

  <script>
    (() => {
      const thumbs = Array.from(document.querySelectorAll(".gallery-thumb"));
      const lightbox = document.getElementById("galleryLightbox");
      const image = lightbox.querySelector(".lightbox-image");
      const caption = lightbox.querySelector(".lightbox-caption");
      const closeButton = lightbox.querySelector(".lightbox-close");
      const prevButton = lightbox.querySelector(".lightbox-prev");
      const nextButton = lightbox.querySelector(".lightbox-next");
      let currentIndex = 0;

      const showImage = (index) => {
        currentIndex = (index + thumbs.length) % thumbs.length;
        const thumbImage = thumbs[currentIndex].querySelector("img");
        image.src = thumbImage.currentSrc || thumbImage.src;
        image.alt = thumbImage.alt;
        caption.textContent = `${currentIndex + 1} / ${thumbs.length}`;
      };

      const openLightbox = (index) => {
        showImage(index);
        lightbox.classList.add("is-open");
        lightbox.setAttribute("aria-hidden", "false");
        document.body.classList.add("is-lightbox-open");
        closeButton.focus();
      };

      const closeLightbox = () => {
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.classList.remove("is-lightbox-open");
        thumbs[currentIndex].focus();
      };

      thumbs.forEach((thumb, index) => {
        thumb.addEventListener("click", () => openLightbox(index));
      });

      prevButton.addEventListener("click", () => showImage(currentIndex - 1));
      nextButton.addEventListener("click", () => showImage(currentIndex + 1));
      closeButton.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", (event) => {
        if (!lightbox.classList.contains("is-open")) return;
        if (event.key === "Escape") closeLightbox();
        if (event.key === "ArrowLeft") showImage(currentIndex - 1);
        if (event.key === "ArrowRight") showImage(currentIndex + 1);
      });
    })();
  </script>
